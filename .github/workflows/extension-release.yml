name: Release Extension

# Tag prefix is fixed at `extension-v*`. A bare `v*` already triggers
# docker-publish.yml, and the two patterns do not overlap.
#
# A push to prerelease/vX.Y.Z (a feature PR merged into the block) publishes
# X.Y.Z-alpha.N; a push to master (the block merged) publishes X.Y.Z-beta.N.
# Both need a change under `paths`. `paths` is not evaluated for tag pushes,
# so tags always run. The tag the release creates is pushed with
# GITHUB_TOKEN, which does not trigger workflows, so there is no loop.
on:
  push:
    branches:
      - master
      - "prerelease/v*"
    tags:
      - "extension-v*"
    # The extension, every workspace package it depends on (directly or through
    # @crikket/api), and the root files that decide how it is built.
    paths:
      - "apps/extension/**"
      - "packages/api/**"
      - "packages/auth/**"
      - "packages/billing/**"
      - "packages/bug-reports/**"
      - "packages/capture-core/**"
      - "packages/config/**"
      - "packages/db/**"
      - "packages/env/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "tsconfig.json"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. extension-v0.1.2-alpha.1"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release (otherwise build only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package extension
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
      BUILD_NUMBER: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.run_number || '' }}
      RELEASE_BRANCH: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Plan release
        id: plan
        run: bun apps/extension/scripts/plan-release.ts

      - name: Configure extension environment
        working-directory: apps/extension
        env:
          APP_URL: ${{ vars.EXTENSION_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable EXTENSION_APP_URL is not set. Release builds must not fall back to localhost."
            exit 1
          fi
          printf 'VITE_APP_URL=%s\n' "$APP_URL" > .env

      # Only the extension and the workspace packages it depends on: unrelated
      # workspaces (e.g. docs) can't block a release.
      - name: Type check
        run: bun x turbo run check-types --filter=extension...

      - name: Run tests
        run: bun run test

      - name: Package Chromium
        working-directory: apps/extension
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: bun run zip

      - name: Package Firefox
        working-directory: apps/extension
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: bun run zip:firefox

      # Blocks the release: `publish` needs this job, so a failure here means
      # no GitHub Release is created. Checks the packages, their manifests and
      # that the backend this build targets answers /health.
      - name: Verify release
        env:
          APP_URL: ${{ vars.EXTENSION_APP_URL }}
          SERVER_URL: ${{ vars.EXTENSION_SERVER_URL }}
        run: |
          version="$(jq -r .version apps/extension/package.json)"
          bun apps/extension/scripts/verify-release.ts --browser chrome --zip "apps/extension/.output/extension-$version-chrome.zip"
          bun apps/extension/scripts/verify-release.ts --browser firefox --skip-health --zip "apps/extension/.output/extension-$version-firefox.zip"

      - name: Name artifacts
        run: |
          mkdir -p release
          cp "apps/extension/.output/extension-$(jq -r .version apps/extension/package.json)-chrome.zip" "release/${{ steps.plan.outputs.chromium_artifact }}"
          cp "apps/extension/.output/extension-$(jq -r .version apps/extension/package.json)-firefox.zip" "release/${{ steps.plan.outputs.firefox_artifact }}"
          cp "${{ steps.plan.outputs.notes_path }}" release/release-notes.md
          ls -l release

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: extension-release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: extension-release
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Extension ${TAG#extension-v}" \
            --notes-file release/release-notes.md \
            "${flags[@]}"
