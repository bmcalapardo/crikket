name: Changelog

# Enforces "Changelog and Versioning" in CONTRIBUTING.md through
# apps/extension/scripts/check-changelog.ts. Runs on label changes too, so
# adding or removing `skip-changelog` re-evaluates the PR.
#
# - PR into prerelease/vX.Y.Z: append-only changelog line, block version.
# - PR into master: only a prerelease/vX.Y.Z block (validated whole) or a
#   hotfix/ branch (see hotfix-approval.yml).
on:
  pull_request:
    branches:
      - master
      - "prerelease/**"
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The script only uses node built-ins, so no dependency install.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Check changelog
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bun apps/extension/scripts/check-changelog.ts
